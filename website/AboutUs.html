<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn about Smile Empress Dental Hub, our dental team, clinic branches, and commitment to compassionate care for healthy, confident smiles.">
    <title>About Us | Smile Empress Dental Hub</title>
    <link rel="stylesheet" href="./css/AboutUs.css">
    <link rel="stylesheet" href="./css/AboutUs.min.css">
    <link rel="stylesheet" href="./css/fontawesome-local.min.css">
</head>
<body>

<a href="index.html" class="back-home-btn">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Home
</a>

<section class="hero" id="about">
    <div class="hero-text">
        <span class="tag" id="aboutHeroTag"></span>
        <h1 id="aboutHeroTitle"></h1>
        <p id="aboutHeroDescription"></p>
        <div class="hero-actions">
            <a id="viewBranchesButton" href="#branches" class="btn primary-btn"></a>
            <a id="meetTeamButton" href="#team" class="btn outline-btn"></a>
        </div>
    </div>

    <div class="hero-panel">
        <div class="hero-icon">
            <i class="fa-solid fa-tooth"></i>
        </div>
        <h3 id="heroCardTitle"></h3>
        <p id="heroCardDescription"></p>
        <div class="hero-mini-grid">
            <div>
                <strong id="branchCount"></strong>
                <span id="branchCountLabel"></span>
            </div>
            <div>
                <strong id="careTeamCount"></strong>
                <span id="careTeamCountLabel"></span>
            </div>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-title">
        <span id="whoWeAreTag"></span>
        <h2 id="whoWeAreTitle"></h2>
        <p id="whoWeAreDescription"></p>
    </div>

    <div class="about-grid">
        <div class="about-card">
            <i class="fa-solid fa-bullseye"></i>
            <h3 id="missionTitle"></h3>
            <p id="missionContent"></p>
        </div>

        <div class="about-card">
            <i class="fa-solid fa-eye"></i>
            <h3 id="visionTitle"></h3>
            <p id="visionContent"></p>
        </div>

        <div class="about-card">
            <i class="fa-solid fa-hand-holding-heart"></i>
            <h3 id="careTitle"></h3>
            <p id="careContent"></p>
        </div>
    </div>
</section>

<section class="team-section" id="team">
    <div class="section-title">
        <span id="teamSectionTag"></span>
        <h2 id="teamSectionTitle"></h2>
        <p id="teamSectionDescription"></p>
    </div>

    <div class="owner-card">
        <div class="owner-photo">
            <img id="ownerImage" src="" alt="" width="360" height="420" loading="lazy" decoding="async">
        </div>

        <div class="owner-content">
            <p id="ownerMessage1"></p>
            <p id="ownerMessage2"></p>
            <span class="owner-label" id="ownerLabel"></span>
            <h3 id="ownerName"></h3>
            <p class="owner-role" id="ownerPosition"></p>
        </div>
    </div>

    <div class="team-category" id="dentistCategory">
        <div class="section-title">
            <span id="dentistSectionTag">Dentist</span>
            <h2 id="dentistSectionTitle"></h2>
            <p id="dentistSectionDescription"></p>
        </div>
        <div class="team-grid" id="dentistGrid"></div>
    </div>

    <div class="team-category" id="assistantCategory">
        <div class="section-title">
            <span id="assistantSectionTag">Dental Assistant</span>
            <h2 id="assistantSectionTitle"></h2>
            <p id="assistantSectionDescription"></p>
        </div>
        <div class="team-grid" id="assistantGrid"></div>
    </div>

    <div class="team-category" id="receptionistCategory">
        <div class="section-title">
            <span id="receptionistSectionTag">Receptionist</span>
            <h2 id="receptionistSectionTitle"></h2>
            <p id="receptionistSectionDescription"></p>
        </div>
        <div class="team-grid" id="receptionistGrid"></div>
    </div>
</section>

<section class="branch-section" id="branches">
    <div class="branch-header">
        <span id="branchSectionTag"></span>
        <h2 id="branchSectionTitle"></h2>
    </div>
    <div class="branches-grid" id="branchesGrid"></div>
</section>

<section class="map-section" id="location">
    <div class="section-title">
        <span id="mapSectionTag"></span>
        <h2 id="mapSectionTitle"></h2>
        <p id="mapSectionDescription"></p>
    </div>
    <div class="map-grid" id="mapGrid"></div>
</section>

<footer>
    <p id="footerCopyright"></p>
</footer>

<script src="./js/AboutUs.js" defer></script>

</body>
</html>
