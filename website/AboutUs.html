<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Smile Empress Dental Hub</title>

    <link rel="stylesheet" href="./css/AboutUs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<a href="index.html" class="back-home-btn">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Home
</a>

<section class="hero" id="about">
    <div class="hero-text">
        <span class="tag" id="aboutHeroTag"></span>
        <h1 id="aboutHeroTitle"></h1>
        <p id="aboutHeroDescription"></p>

        <div class="hero-actions">
            <a id="viewBranchesButton" href="#branches" class="btn primary-btn"></a>
            <a id="meetTeamButton" href="#team" class="btn outline-btn"></a>
        </div>
    </div>

    <div class="hero-panel">
        <div class="hero-icon">
            <i class="fa-solid fa-tooth"></i>
        </div>

        <h3 id="heroCardTitle"></h3>
        <p id="heroCardDescription"></p>

        <div class="hero-mini-grid">
            <div>
                <strong id="branchCount"></strong>
                <span id="branchCountLabel"></span>
            </div>

            <div>
                <strong id="careTeamCount"></strong>
                <span id="careTeamCountLabel"></span>
            </div>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-title">
        <span id="whoWeAreTag"></span>
        <h2 id="whoWeAreTitle"></h2>
        <p id="whoWeAreDescription"></p>
    </div>

    <div class="about-grid">
        <div class="about-card">
            <i class="fa-solid fa-bullseye"></i>
            <h3 id="missionTitle"></h3>
            <p id="missionContent"></p>
        </div>

        <div class="about-card">
            <i class="fa-solid fa-eye"></i>
            <h3 id="visionTitle"></h3>
            <p id="visionContent"></p>
        </div>

        <div class="about-card">
            <i class="fa-solid fa-hand-holding-heart"></i>
            <h3 id="careTitle"></h3>
            <p id="careContent"></p>
        </div>
    </div>
</section>

<section class="team-section" id="team">
    <div class="section-title">
        <span id="teamSectionTag"></span>
        <h2 id="teamSectionTitle"></h2>
        <p id="teamSectionDescription"></p>
    </div>

    <div class="owner-card">
        <div class="owner-photo">
            <img id="ownerImage" src="" alt="">
        </div>

        <div class="owner-content">
            <p id="ownerMessage1"></p>
            <p id="ownerMessage2"></p>

            <span class="owner-label" id="ownerLabel"></span>

            <h3 id="ownerName"></h3>

            <p class="owner-role" id="ownerPosition"></p>
        </div>
    </div>

    <div class="team-grid">
        <div class="team-card">
            <img id="doctor1Image" src="" alt="">
            <div class="team-info">
                <h3 id="doctor1Name"></h3>
                <p id="doctor1Position"></p>
            </div>
        </div>

        <div class="team-card">
            <img id="doctor2Image" src="" alt="">
            <div class="team-info">
                <h3 id="doctor2Name"></h3>
                <p id="doctor2Position"></p>
            </div>
        </div>

        <div class="team-card">
            <img id="assistant1Image" src="" alt="">
            <div class="team-info">
                <h3 id="assistant1Name"></h3>
                <p id="assistant1Position"></p>
            </div>
        </div>

        <div class="team-card">
            <img id="assistant2Image" src="" alt="">
            <div class="team-info">
                <h3 id="assistant2Name"></h3>
                <p id="assistant2Position"></p>
            </div>
        </div>
    </div>
</section>

<section class="branch-section" id="branches">
    <div class="branch-header">
        <span id="branchSectionTag"></span>
        <h2 id="branchSectionTitle"></h2>
    </div>

    <div class="branches-grid">
        <div class="branch-box">
            <div class="branch-top">
                <div class="branch-icon">
                    <i class="fa-solid fa-building"></i>
                </div>

                <div>
                    <h3 id="makatiBranchName"></h3>
                    <p id="makatiBranchStatus"></p>
                </div>
            </div>

            <div class="branch-details">
                <div>
                    <i class="fa-solid fa-location-dot"></i>
                    <p id="makatiBranchAddress"></p>
                </div>

                <div>
                    <i class="fa-solid fa-building"></i>
                    <p id="makatiBranchLandmark"></p>
                </div>

                <div>
                    <i class="fa-solid fa-clock"></i>
                    <p id="makatiBranchHours"></p>
                </div>

                <div>
                    <i class="fa-solid fa-calendar-check"></i>
                    <p id="makatiBranchSchedule"></p>
                </div>
            </div>

            <a id="makatiBranchMapButton" href="#makati-map" class="branch-btn"></a>
        </div>

        <div class="branch-box">
            <div class="branch-top">
                <div class="branch-icon">
                    <i class="fa-solid fa-hospital"></i>
                </div>

                <div>
                    <h3 id="lasPinasBranchName"></h3>
                    <p id="lasPinasBranchStatus"></p>
                </div>
            </div>

            <div class="branch-details">
                <div>
                    <i class="fa-solid fa-location-dot"></i>
                    <p id="lasPinasBranchAddress"></p>
                </div>

                <div>
                    <i class="fa-solid fa-clock"></i>
                    <p id="lasPinasBranchHours"></p>
                </div>
            </div>

            <a id="lasPinasBranchMapButton" href="#laspinas-map" class="branch-btn"></a>
        </div>
    </div>
</section>

<section class="map-section" id="location">
    <div class="section-title">
        <span id="mapSectionTag"></span>
        <h2 id="mapSectionTitle"></h2>
        <p id="mapSectionDescription"></p>
    </div>

    <div class="map-grid">
        <div class="map-card" id="makati-map">
            <div class="map-header">
                <h3 id="makatiMapBranchName"></h3>
                <p id="makatiMapBranchAddress"></p>
            </div>

            <div class="map-wrapper">
                <iframe id="makatiBranchMap" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

        <div class="map-card" id="laspinas-map">
            <div class="map-header">
                <h3 id="lasPinasBranchName"></h3>
                <p id="lasPinasBranchAddress"></p>
            </div>

            <div class="map-wrapper">
                <iframe id="lasPinasBranchMap" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </div>
</section>

<footer>
    <p id="footerCopyright"></p>
</footer>

<script src="./js/AboutUs.js" defer></script>
</body>
</html>
